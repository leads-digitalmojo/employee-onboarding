# Firebase App Hosting config — deploys this Next.js app to a managed,
# autoscaling Cloud Run-backed service. See README.md "Deploying to Firebase".
#
# Secrets (FIREBASE_SERVICE_ACCOUNT_KEY, ANTHROPIC_API_KEY if used) are set via
# `firebase apphosting:secrets:set <NAME>` and referenced below, not written
# here in plaintext.
runConfig:
  # This app has near-zero traffic (a handful of new hires, occasionally) —
  # scale to zero between requests rather than paying for an idle instance.
  minInstances: 0
  maxInstances: 2

env:
  - variable: FIREBASE_STORAGE_BUCKET
    value: REPLACE_WITH_YOUR_PROJECT_ID.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME

  # Public web config for the Google sign-in popup — not secrets, but they
  # must be present at BUILD time: Next.js inlines NEXT_PUBLIC_* values into
  # the client bundle when it builds, not when the server later starts.
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: REPLACE_WITH_YOUR_API_KEY
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: REPLACE_WITH_YOUR_PROJECT_ID.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: REPLACE_WITH_YOUR_PROJECT_ID
    availability:
      - BUILD
      - RUNTIME

  # On App Hosting the backend's own service account already has Firestore +
  # Storage access — FIREBASE_SERVICE_ACCOUNT_KEY is not needed there and
  # should stay unset. Uncomment only if deploying this app somewhere that
  # isn't Firebase/GCP infrastructure (see .env.example).
  # - variable: FIREBASE_SERVICE_ACCOUNT_KEY
  #   secret: FIREBASE_SERVICE_ACCOUNT_KEY
  #   availability:
  #     - RUNTIME
