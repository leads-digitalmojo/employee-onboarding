# Firebase App Hosting config — deploys this Next.js app to a managed,
# autoscaling Cloud Run-backed service. See README.md "Deploying to Firebase".
#
# Secrets (ANTHROPIC_API_KEY if used) are set via
# `firebase apphosting:secrets:set <NAME>` and referenced below, not written
# here in plaintext.
runConfig:
  # This app has near-zero traffic (a handful of new hires, occasionally) —
  # scale to zero between requests rather than paying for an idle instance.
  minInstances: 0
  maxInstances: 2

env:
  - variable: FIREBASE_STORAGE_BUCKET
    value: new-employee-3a30c.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME

  # Public web config for the Google sign-in popup — not secrets, but they
  # must be present at BUILD time: Next.js inlines NEXT_PUBLIC_* values into
  # the client bundle when it builds, not when the server later starts.
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyBL8nF3onxdd1XvFr8uD0CQ88t3GS0UVJY
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: new-employee-3a30c.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: new-employee-3a30c
    availability:
      - BUILD
      - RUNTIME

  # On App Hosting the backend's own default service account
  # (firebase-app-hosting-compute@new-employee-3a30c.iam.gserviceaccount.com)
  # already has Firestore + Storage access via Application Default
  # Credentials — FIREBASE_SERVICE_ACCOUNT_KEY is intentionally unset here.
  # Uncomment only if that turns out insufficient, or if this app is ever
  # deployed somewhere that isn't Firebase/GCP infrastructure:
  # - variable: FIREBASE_SERVICE_ACCOUNT_KEY
  #   secret: FIREBASE_SERVICE_ACCOUNT_KEY
  #   availability:
  #     - RUNTIME
